<script>
  const quotes = [
      "Time keeps you in a constant state of change, ever pushing your life in a direction, and where your life is headed depends on whether or not it is under the influence of your intent.",
      "Change is rarely easy, but I've seldom heard anyone say it wasn't worth it. They'll speak about how their lives have been enhanced, how they have things now that they didn't before, and about the ways they feel now that they wouldn't have otherwise. Oftentimes, it's a matter of finding the right combination of catalysts to do so.",
      "Some Visitors find themselves going in circles, repeating the same cycles over and over again. It often comes from an unidentified influence from the depths of the mind, and until the unconscious is made conscious, it will deictate their lives, and they will call it the weavings of Fate.",
	  "If you've tried everything and nothing works, then the problem might lie within you. However, make no mistake, this is great news; because out of everything in life, the one entity anyone has the most amount of control over, Visitor, is none other than themselves.",
	  "Sometimes, you might find yourself a great deal of motivation in the dead of night, a sudden gusto to change one's life once and for all, only for it to vanish come morning's light.",
	  "Oftentimes, we're so focused on where we should be in life that the decision we sometimes make are not suitable for the present time, and then we're surprised when things don't go our way."
  ];
  
  const quotesSecond = [
      "The way I see it, Visitor, so as long as your life is going somewhere, you might as well be the one choosing its direction.",
      "If that is a journey you are willing to take, Visitor, I would be honored to guide you through.",
      "A different perspective might be the thing you need to help you better understand yourself.",
	  "What if I told you it was possible to reclaim that control?",
	  "Should you find yourself willing, Visitor, I can perhaps show you the way to bottle the lightning that is your motivation.",
	  "Let me meet you where you're at, dear Visitor, and we'll go from there."
  ];
  const randomNum = Math.floor(Math.random() * quotes.length);
  document.getElementById("firstQuote").textContent = quotes[randomNum];
  document.getElementById("secondQuote").textContent = quotesSecond[randomNum];
</script>
